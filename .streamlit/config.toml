# DeckCheck UI theme (ui/app.py): dark, high contrast, one red accent for primary actions and
# brand moments (design spec: netflix.com-design.md tokens, applied to DeckCheck's own brand).
# Page details (type scale, radii, buttons, cards) are CSS in ui/theme.py.
[theme]
base = "dark"
primaryColor = "#E50914"
backgroundColor = "#000000"
secondaryBackgroundColor = "#111111"
textColor = "#FFFFFF"
font = "sans serif"

[server]
runOnSave = false
