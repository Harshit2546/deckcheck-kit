# config/rules.yaml: every number a human may need to change lives here, never in code.
#
# !!! PLACEHOLDER VALUES !!!  claude-core wrote the SCHEMA only (T01). The finance partner sets the
# real values (T05). Every number below marked "placeholder" is a guess to keep the code runnable.
# The schema is validated by core/models.py `Rules`; a misspelled key fails at load time.
# Where to change what in a live fix: docs/LIVE_FIX_MAP.md.

version: 1

# Run limits. The runner checks the ledger total against these before EVERY external call.
# Hitting one makes the remaining claims HELD (reason: budget | credits | time), never CANNOT_VERIFY.
limits:
  max_cost_inr: 500        # placeholder: total rupee cost per run (LLM + data calls)
  max_seconds: 900         # placeholder: working seconds per run, summed across resumes
  max_credits: 200         # placeholder: Crustdata credits per run
  per_call_timeout_s: 30   # placeholder: one external call longer than this becomes HELD (timeout)

# How the ledger turns usage into rupees (used by sources/ when it writes a ledger row).
pricing:
  inr_per_credit: 1.0            # placeholder
  inr_per_1k_tokens_in: 0.25     # placeholder
  inr_per_1k_tokens_out: 1.25    # placeholder

# Outward actions. The founder email may only ever go to this team test inbox.
actions:
  test_inbox_recipient: test-inbox@deckcheck.invalid   # placeholder: team test inbox address
  email_subject_template: "Questions on your pitch deck ({company})"

# Per claim type, named tolerances read by verdict/engine.py. Keys are free-form per claim type;
# whoever writes the engine for a type documents the keys it reads here.
tolerances:
  team_size:
    tolerance_pct: 20      # placeholder: headcount within +-20% of the deck counts as SUPPORTED
  funding:
    tolerance_pct: 10      # placeholder: round size within +-10%
    date_window_days: 90   # placeholder: round date within +-90 days
  team_growth:
    tolerance_pct: 15      # placeholder
  traction:
    tolerance_pct: 15      # placeholder
  hiring:
    tolerance_pct: 25      # placeholder
  market_size:
    tolerance_pct: 30      # placeholder
  founder_background:
    tenure_months: 6       # placeholder: stated tenure may differ by this many months
  prior_exit:
    tolerance_pct: 10      # placeholder
  company_fact:
    year_tolerance: 0      # placeholder: founding year must match exactly
  customer:
    min_quote_match: 1.0   # placeholder: 1.0 = quote must appear verbatim on the fetched page
  competition:
    min_quote_match: 1.0   # placeholder

# Title keyword (lower case) -> seniority level, higher = more senior. Used to compare "CEO" with
# "Chief Executive Officer" style differences in founder / hiring claims.
title_levels:
  founder: 5               # placeholder values (all of them)
  ceo: 5
  cto: 5
  coo: 5
  cfo: 5
  president: 5
  vp: 4
  director: 3
  head: 3
  lead: 2
  manager: 2
  senior: 2
  engineer: 1
  associate: 1
  intern: 0

# Claim type -> materiality weight (how much a wrong claim matters). Ranks the red-flag list.
materiality_weights:
  founder_background: 5    # placeholder values (all of them)
  prior_exit: 5
  funding: 5
  team_size: 3
  team_growth: 3
  company_fact: 3
  customer: 4
  hiring: 2
  traction: 4
  market_size: 2
  competition: 1

# Output fields per report section, in order. The hour-3 requirement change usually edits this.
# Section names are read by report/ ; each list item is a field name of the row it describes.
output_fields:
  claim_table:
    - claim_id
    - slide
    - quote
    - type
    - verdict
    - reason_code
    - explanation
    - confidence
    - sources
  red_flags:
    - claim_id
    - type
    - verdict
    - materiality
    - explanation
  founder_questions:
    - claim_id
    - question
  evidence_requests:
    - claim_id
    - missing
