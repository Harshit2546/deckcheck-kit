# config/rules.yaml — every tolerance, limit, rate and output field DeckCheck uses.
# THE FINANCE PARTNER SETS THE REAL VALUES (T05). Code reads them via core/config.py, never hard-codes them.
# Keys checked at start-up are listed in core/config.py REQUIRED_KEYS.
# Values marked PLACEHOLDER were set by claude-core for T01 and must be confirmed in T05.

limits:
  max_cost_inr: 500          # PLACEHOLDER. Run stops spending; remaining claims become HELD (budget)
  max_seconds: 900           # PLACEHOLDER. Wall time from first start; then HELD (time)
  max_credits: 200           # PLACEHOLDER. Crustdata credits per run
  per_call_timeout_s: 30     # PLACEHOLDER. A slower call becomes HELD (timeout), never CANNOT_VERIFY. Raised from 20 after live web searches took up to 20+ s (INCIDENTS A6)

costs:                       # rupee rates used to fill ledger.cost_inr
  crustdata:
    inr_per_credit: 1.0      # PLACEHOLDER
  llm:
    default:                 # used when a model has no entry of its own
      inr_per_1k_tokens_in: 0.25   # PLACEHOLDER
      inr_per_1k_tokens_out: 1.25  # PLACEHOLDER
  web:
    inr_per_call: 0.0        # PLACEHOLDER (search/fetch cost per call)

web:                         # D16, docs/WEB_SOURCE.md. Crustdata web search + fetch, billed as Crustdata credits
  sources: [news, web]       # PLACEHOLDER. Crustdata search sources
  location: IN               # PLACEHOLDER. ISO country for search results
  results_to_fetch: 3        # PLACEHOLDER. Pages fetched per claim (1 credit each, plus 1 LLM call each)
  max_page_chars: 12000      # PLACEHOLDER. Page text sent to the LLM to pick a quote
  human_mode: false          # PLACEHOLDER. Browser-like fetch for bot-protected sites
  fetch_timeout_s: 45        # PLACEHOLDER. Seconds one page fetch call may take before the claim is HELD timeout (search uses limits.per_call_timeout_s)

identity:
  min_signals: 2             # two-signal rule: a person or company matches only on >= 2 signals

tolerances:                  # one entry per claim type: how close observed must be to stay SUPPORTED
  founder_background:
    min_title_level: director      # PLACEHOLDER. Claimed title must match at or above this level (title_levels)
    tenure_tolerance_months: 6     # PLACEHOLDER. Allowed gap in claimed start/end dates
  prior_exit:
    tolerance_pct: 10              # PLACEHOLDER. Exit value gap, when a value is claimed
  team_size:
    tolerance_pct: 20              # PLACEHOLDER
  team_growth:
    tolerance_pct: 25              # PLACEHOLDER
    window_tolerance_days: 45      # PLACEHOLDER (T29). A "yearly" growth window may be 365 +- this many days
  funding:
    tolerance_pct: 10              # PLACEHOLDER
    max_record_age_days: 3650      # PLACEHOLDER (D14). A funding round up to 10 years before the deck date still counts
  company_fact:
    tolerance_pct: 0               # PLACEHOLDER. Founded year, HQ etc. must match exactly
    year_gap_cannot_verify: 1      # PLACEHOLDER (T29). Founded-year gap up to this many years is CANNOT_VERIFY, above it CONTRADICTED
  customer:
    require_exact_quote: true      # PLACEHOLDER. Customer named on a fetched page, verbatim
    max_record_age_days: 1095      # PLACEHOLDER (D16). A dated web mention up to 3 years before the deck date counts
  hiring:
    tolerance_pct: 30              # PLACEHOLDER. Open roles count gap
  traction:
    tolerance_pct: 15              # PLACEHOLDER
  market_size:
    tolerance_pct: 50              # PLACEHOLDER. Third-party estimates vary widely
    min_agreeing_sources: 2        # PLACEHOLDER (D16). CONTRADICTED needs this many agreeing estimates from different domains
    max_record_age_days: 1095      # PLACEHOLDER (D16). Market reports up to 3 years before the deck date count
  competition:
    require_exact_quote: true      # PLACEHOLDER
  max_record_age_days: 365         # PLACEHOLDER. Older evidence than this is NOT_COMPARABLE

verdict:                     # D8: confidence margins read by verdict/engine.py
  supported_margin: 0.5      # PLACEHOLDER. diff <= 0.5 x tolerance = clearly close match (high confidence)
  strong_margin: 2.0         # PLACEHOLDER. diff >= 2.0 x tolerance = clearly wrong number (high confidence)
  fresh_days: 90             # PLACEHOLDER. record within 90 days of the claim's date = fresh
  undated_fallback: true     # PLACEHOLDER (D17). When no dated record exists, may an undated one be used (flagged, low confidence)?
  undated_max_deck_age_days: 90  # PLACEHOLDER (D17). Only if the deck date is at most this many days before the data was retrieved

title_levels:                # PLACEHOLDER. Used by the founder_background verdict rules
  c_level: [ceo, cto, coo, cfo, cpo, founder, co-founder]
  vp: [vp, vice president, head]
  director: [director]
  manager: [manager, lead]
  ic: [engineer, analyst, associate, consultant]

materiality:                 # PLACEHOLDER weights for ranking red flags (higher = worse if wrong)
  founder_background: 5
  prior_exit: 5
  funding: 5
  customer: 4
  traction: 4
  team_size: 3
  team_growth: 3
  company_fact: 2
  hiring: 2
  market_size: 1
  competition: 1

output:
  fields:                    # per-claim fields in the report; the hour-3 change may add one here
    - claim_id
    - slide
    - quote
    - type
    - value                  # D3: shown as claimed_value
    - label                  # D3: shown as verdict
    - reason_code
    - explanation
    - confidence
    - missing
    - sources

actions:
  test_inbox: founder-test@deckcheck.invalid   # PLACEHOLDER. The ONLY recipient emails may go to
