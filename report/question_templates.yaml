# report/question_templates.yaml: wording of founder questions and evidence requests.
# Reviewed and finalized by finance partner.
# Valid placeholders: {slide} {quote} {type} {subject} {explanation} {missing} {reason_code}
# Tone: constructive, neutral, and diligence-focused. Advice for investors, never an automatic rejection.

# Inquired when a claim is CONTRADICTED. Tailored by claim type, with 'default' fallback.
founder_questions:
  default: 'Slide {slide} notes: "{quote}". Our records show a variance: {explanation} Could you provide context or updated documentation on this metric?'
  funding: 'Slide {slide} notes: "{quote}". Our records reflect: {explanation} Could you share the relevant round announcement, filings, or term sheet summary?'
  team_size: 'Slide {slide} notes: "{quote}". Our records indicate: {explanation} Could you clarify whether this headcount includes contractors, interns, or subsidiary staff?'
  founder_background: 'Slide {slide} notes: "{quote}". Our records reflect: {explanation} Could you share the appointment details or professional timeline for {subject}?'

# Requested for CANNOT_VERIFY and NOT_COMPARABLE claims: what specific documentation clarifies them.
evidence_requests:
  default: 'Slide {slide} ({type}): to complete verification, please provide {missing}'

# Internal diligence audit notes for HELD claims (pending retrieval or pipeline retry).
held_notes:
  default: 'Slide {slide} ({type}) was held ({reason_code}). {missing}'
